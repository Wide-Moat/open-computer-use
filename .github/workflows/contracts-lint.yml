#
# Schema-lint for Layer-8 contract artifacts under `contracts/`.
#
# Enforces:
#   - every *.schema.json is valid JSON and a valid JSON Schema 2020-12 document
#     (ajv compile against the draft 2020-12 meta-schema).
#   - every *.asyncapi.yaml is a valid AsyncAPI document (@asyncapi/parser via
#     scripts/validate-asyncapi.mjs). Validation is hermetic: the OCSF payload
#     schemas are vendored under contracts/audit/ocsf/ and $ref'd by relative
#     path, so the verdict depends on the repository alone. It previously made
#     16 requests to schema.ocsf.io per run, which made a green mean "that host
#     answered" and produced intermittent FetchError reds.
#   - every *.openapi.yaml is a valid OpenAPI 3.1 document (redocly lint against
#     contracts/openapi/redocly.yaml — the operator plane is a host-owned UDS, so
#     the no-empty-servers and the not/required-XOR rules are turned off there).
#   - every *.proto lints and builds (buf lint, against contracts/proto/buf.yaml).
#   - no denied naming terms leak into a contract file.

name: contracts-lint

on:
  # No path filter. `asyncapi` is a REQUIRED context, and a required context
  # that does not arrive is a permanent block rather than a skipped check --
  # measured on #508, where this file's filter left it ABSENT and only the
  # absence of branch protection (#408) let the PR merge (#510).
  #
  # The scripts/** entry that used to be here existed for the nfr-gates job,
  # which now has its own workflow. What remains reads contracts/ only, so
  # running it on every PR costs a lint of eleven documents.
  pull_request:
  push:
    branches:
      - next/v1

permissions:
  contents: read

jobs:
  json-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Validate JSON Schema 2020-12 documents
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/**/*.schema.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no schema files"; exit 0; fi
          # --spec=draft2020 loads the 2020-12 meta-schema (ajv-cli@5 defaults to
          # draft-07 and errors "no schema 2020-12" without it). --strict=false
          # validates against that meta-schema without policing spec-legal vendor
          # keywords (x-ocu-*) or the $comment-* convention. Unknown string
          # "format" values are warned-and-ignored, not errors; the schemas pin
          # the same constraints with explicit `pattern` regexes.
          for f in "${files[@]}"; do
            echo "::group::$f"
            npx --yes ajv-cli@5.0.0 compile --spec=draft2020 --strict=false -s "$f"
            echo "::endgroup::"
          done

  asyncapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Validate AsyncAPI documents
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/**/*.asyncapi.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no asyncapi files"; exit 0; fi
          # @asyncapi/parser, not @asyncapi/cli: the CLI pins
          # @asyncapi/generator@3.0.1, whose "@asyncapi/generator-hooks": "*"
          # resolves to an unpublished 0.1.1 and 404s, so the CLI cannot install
          # at any published version. The version is pinned for the same reason
          # a floating one broke the CLI.
          npm install --no-save --no-audit --no-fund @asyncapi/parser@3.4.0
          node scripts/validate-asyncapi.mjs "${files[@]}"
      - name: every $ref resolves on disk, not over the network
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # Every contract, not just the AsyncAPI one. redocly and ajv resolve a
          # remote $ref the same way the AsyncAPI parser does, and the other
          # twelve documents carry 164 refs between them under no such check.
          # The vendored OCSF schemas are excluded as targets, not as subjects:
          # they are $ref'd BY the fan-in document and validated through it.
          files=(contracts/**/*.schema.json contracts/**/*.asyncapi.yaml contracts/**/*.openapi.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no contract files"; exit 1; fi
          python3 scripts/check-contract-refs-are-local.py "${files[@]}"
      # The two red-probes below run the checkers against constructed inputs
      # that MUST fail. Both checkers were invoked only by their live run, which
      # proves they pass on a correct tree and not that they would fail on a
      # broken one. The meta-gate proves each self-test is bound to its subject;
      # it does not run them, and nothing else did.
      - name: the ref-locality checker itself discriminates
        run: python3 scripts/check-contract-refs-are-local.py --self-test
      - name: the fan-in INV-1 checker itself discriminates
        run: python3 scripts/check-audit-fanin-inv1.py --self-test
      - name: audit fan-in INV-1 (receive-only)
        run: python3 scripts/check-audit-fanin-inv1.py
      # The parser above proves each payload $ref resolves to a well-formed JSON
      # Schema. It does not prove WHICH schema: swapping a vendored OCSF class
      # for a different one leaves both sides valid and the validator green
      # (measured — the swap exits 0 there and 1 here). This binds each message
      # to the class uid its own title claims.
      - name: OCSF class identity red-probe (RED-when-swapped, two-sided)
        run: python3 scripts/check-ocsf-class-identity.py --self-test
      - name: OCSF class identity (message title uid == vendored class uid)
        # NFR-MAINT-AUDIT-SCHEMA. Its verification column asks for an "OCSF JSON
        # CI gate", which is this step: it binds each fan-in message to the class
        # it claims, so a vendored file re-pointed at another OCSF version fails
        # here rather than validating clean. Named so check-nfr-coverage.py counts
        # the requirement as armed -- and this job blocks, so the name is not
        # decoration. The bridge-integration half of that row (CEF / ECS / UDM)
        # has no gate yet and is not claimed by this line.
        run: python3 scripts/check-ocsf-class-identity.py
      # NFR-SEC-89. The self-test is the gate; it drives the verdict against
      # constructed API shapes including the ones that must FAIL, so the check
      # cannot quietly stop discriminating.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Validate OpenAPI 3.1 documents
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/openapi/*.openapi.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no openapi files"; exit 0; fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            npx --yes @redocly/cli@1.34.2 lint "$f" --config contracts/openapi/redocly.yaml
            echo "::endgroup::"
          done

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
      - name: Validate Protobuf definitions
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/proto/**/*.proto)
          if [ ${#files[@]} -eq 0 ]; then echo "no proto files"; exit 0; fi
          # Pinned by CONTENT, not only by version tag. A release asset is
          # mutable -- a tag can be moved and the binary replaced -- so the
          # version alone buys nothing against a substituted artifact, and this
          # job then executes it. The digests are the upstream sha256.txt for
          # v1.34.0, inlined rather than fetched: downloading the checksum from
          # the same host that serves the binary lets one compromise supply
          # both, which verifies only that the file arrived intact.
          asset="buf-$(uname -s)-$(uname -m)"
          case "$asset" in
            buf-Linux-x86_64)  want=c415352f30bed9bd3083b68fc8a463ca8cd3de5f6430531e9ef14677d2a7fc01 ;;
            buf-Linux-aarch64) want=f739870ef11d13cb91270593bb711e0c520e66b9c18d4dc1a194cae09a68ff61 ;;
            buf-Darwin-x86_64) want=553be8ae5292047148903339ed65220ef202bebabb12b9cc6d3b0de482e34520 ;;
            buf-Darwin-arm64)  want=451e133fd83f0a26c9685c019f3b132f659cbedb6e5d1ed3c7fd194aea72d9d2 ;;
            *) echo "::error::no pinned digest for $asset"; exit 1 ;;
          esac
          curl -sSL -o /tmp/buf "https://github.com/bufbuild/buf/releases/download/v1.34.0/$asset"
          got=$(sha256sum /tmp/buf | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::$asset digest $got does not match the pinned $want"
            exit 1
          fi
          echo "buf $asset matches its pinned digest"
          chmod +x /tmp/buf
          cd contracts/proto
          /tmp/buf lint
          /tmp/buf build

  lexicon:
    runs-on: ubuntu-latest
    env:
      LEXICON_DENYLIST: ${{ secrets.LEXICON_DENYLIST }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
      - name: naming denylist (contracts)
        run: |
          set -euo pipefail
          if [ -z "${LEXICON_DENYLIST:-}" ]; then
            echo "::notice::LEXICON_DENYLIST secret absent — naming-denylist check skipped"
            exit 0
          fi
          # Redact to file:line only; never echo the matched text.
          if grep -rniE "$LEXICON_DENYLIST" contracts/ | cut -d: -f1,2 | sort -u | grep -q .; then
            grep -rniE "$LEXICON_DENYLIST" contracts/ | cut -d: -f1,2 | sort -u
            echo "::error::denied term found in a contract file"
            exit 1
          fi
          echo "contracts/ is clean"
