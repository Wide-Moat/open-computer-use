#
# Schema-lint for Layer-8 contract artifacts under `contracts/`.
#
# Enforces:
#   - every *.schema.json is valid JSON and a valid JSON Schema 2020-12 document
#     (ajv compile against the draft 2020-12 meta-schema).
#   - every *.asyncapi.yaml is a valid AsyncAPI document (@asyncapi/parser via
#     scripts/validate-asyncapi.mjs). Validation is hermetic: the OCSF payload
#     schemas are vendored under contracts/audit/ocsf/ and $ref'd by relative
#     path, so the verdict depends on the repository alone. It previously made
#     16 requests to schema.ocsf.io per run, which made a green mean "that host
#     answered" and produced intermittent FetchError reds.
#   - every *.openapi.yaml is a valid OpenAPI 3.1 document (redocly lint against
#     contracts/openapi/redocly.yaml — the operator plane is a host-owned UDS, so
#     the no-empty-servers and the not/required-XOR rules are turned off there).
#   - every *.proto lints and builds (buf lint, against contracts/proto/buf.yaml).
#   - no denied naming terms leak into a contract file.

name: contracts-lint

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-lint.yml"
      # The jobs below run scripts/check-gates-are-required.py --self-test and
      # the readiness claim. Without this a change to either script — including
      # one breaking its own self-test — triggers none of them: the checker was
      # the one thing its own gate did not check.
      - "scripts/**"
  push:
    branches:
      - next/v1

permissions:
  contents: read

jobs:
  json-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Validate JSON Schema 2020-12 documents
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/**/*.schema.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no schema files"; exit 0; fi
          # --spec=draft2020 loads the 2020-12 meta-schema (ajv-cli@5 defaults to
          # draft-07 and errors "no schema 2020-12" without it). --strict=false
          # validates against that meta-schema without policing spec-legal vendor
          # keywords (x-ocu-*) or the $comment-* convention. Unknown string
          # "format" values are warned-and-ignored, not errors; the schemas pin
          # the same constraints with explicit `pattern` regexes.
          for f in "${files[@]}"; do
            echo "::group::$f"
            npx --yes ajv-cli@5.0.0 compile --spec=draft2020 --strict=false -s "$f"
            echo "::endgroup::"
          done

  asyncapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Validate AsyncAPI documents
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/**/*.asyncapi.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no asyncapi files"; exit 0; fi
          # @asyncapi/parser, not @asyncapi/cli: the CLI pins
          # @asyncapi/generator@3.0.1, whose "@asyncapi/generator-hooks": "*"
          # resolves to an unpublished 0.1.1 and 404s, so the CLI cannot install
          # at any published version. The version is pinned for the same reason
          # a floating one broke the CLI.
          npm install --no-save --no-audit --no-fund @asyncapi/parser@3.4.0
          node scripts/validate-asyncapi.mjs "${files[@]}"
      - name: audit fan-in INV-1 (receive-only)
        run: python3 scripts/check-audit-fanin-inv1.py
      # The parser above proves each payload $ref resolves to a well-formed JSON
      # Schema. It does not prove WHICH schema: swapping a vendored OCSF class
      # for a different one leaves both sides valid and the validator green
      # (measured — the swap exits 0 there and 1 here). This binds each message
      # to the class uid its own title claims.
      - name: OCSF class identity red-probe (RED-when-swapped, two-sided)
        run: python3 scripts/check-ocsf-class-identity.py --self-test
      - name: OCSF class identity (message title uid == vendored class uid)
        run: python3 scripts/check-ocsf-class-identity.py
      # NFR-SEC-89. The self-test is the gate; it drives the verdict against
      # constructed API shapes including the ones that must FAIL, so the check
      # cannot quietly stop discriminating.
      - name: gate-enforcement red-probe (six shapes, one clean)
        run: python3 scripts/check-gates-are-required.py --self-test
      # The live query is REPORT-ONLY today, and deliberately so: it currently
      # reds, because next/v1 has no branch protection and the one ruleset
      # carries enforcement=disabled. Making it blocking now would red every PR
      # for a condition no PR can fix -- enabling protection is an owner action.
      # It is here rather than absent so the violation is visible on every run
      # instead of living in a report nobody opens.
      #
      # The commit that turns enforcement on drops the `|| true` AND must carry
      # three things, or it deadlocks or lies:
      #   1. Enforce via a RULESET, not classic branch protection. The
      #      protection endpoint answers 403 to the Actions token
      #      (administration:read cannot be granted there), so CI can only
      #      observe rulesets. Note this cuts against scripts/apply-layer0-
      #      protection.sh, which writes CLASSIC protection: flipping with that
      #      tool leaves this step permanently red on the cannot-establish
      #      message, correct protection notwithstanding, unless the step is
      #      given an admin-scoped PAT. Flipping via a ruleset keeps
      #      GITHUB_TOKEN sufficient. The applier's REQUIRED list also gains the
      #      codeql context once item 2 lands, or its own verdict reds.
      #   2. Extend codeql.yml's triggers to this branch. It fires on main and
      #      cron only, so no codeql context reports on a next/v1 PR today —
      #      requiring one would block every PR forever on a check that never
      #      arrives.
      #   3. Remove `continue-on-error: true` from sast-semgrep in
      #      security.yml. A required context that cannot fail is green whatever
      #      it finds, which is the exact shape this NFR exists to name.
      # The readiness claim is worth nothing if it is only ever answered when
      # somebody remembers to ask. Report-only for the same reason as the check
      # below: it reports 0 of 3 today because the legs sit in open pull
      # requests, and no PR can fix that — merging them is a review action.
      # What this buys is that the number is on every run, so the day it becomes
      # 3 of 3 nobody has to take that on trust, and the day it regresses the
      # log says so.
      # The self-test is the gate. The live query below is report-only, so
      # without this the delivery reporting could stop discriminating and no
      # run would notice.
      - name: delivery reporting red-probe (six outcomes through the report)
        run: python3 scripts/check-readiness-claim.py --self-test
      - name: deployment-readiness claim (report-only, see NFR §Deployment-readiness)
        # Reads a sibling component's default branch through the contents API.
        # That works from here because the components are public; were one made
        # private, this step would report its leg as unreadable — exit 2, which
        # the script distinguishes from unmet — rather than silently calling the
        # property missing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-readiness-claim.py || true

      - name: gate enforcement on this branch (report-only until protection is on)
        # The github context reaches the script through env, never by
        # interpolation inside the run block. A branch name is
        # attacker-controllable on a fork PR, so interpolating it into the shell
        # would let it close the quote and run its own command on the runner.
        # The SAST gate flags exactly this, and it flagged it here.
        env:
          TARGET_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          # Without a token `gh` refuses to run inside Actions at all, and the
          # `|| true` below swallowed the refusal — so this step reported an auth
          # error every run and nobody saw it. A report-only step that cannot
          # execute is the theatre this NFR exists to name.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-gates-are-required.py \
            --repo "$TARGET_REPO" \
            --branch "$TARGET_BRANCH" || true

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Validate OpenAPI 3.1 documents
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/openapi/*.openapi.yaml)
          if [ ${#files[@]} -eq 0 ]; then echo "no openapi files"; exit 0; fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            npx --yes @redocly/cli@1.34.2 lint "$f" --config contracts/openapi/redocly.yaml
            echo "::endgroup::"
          done

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Validate Protobuf definitions
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(contracts/proto/**/*.proto)
          if [ ${#files[@]} -eq 0 ]; then echo "no proto files"; exit 0; fi
          curl -sSL -o /tmp/buf "https://github.com/bufbuild/buf/releases/download/v1.34.0/buf-$(uname -s)-$(uname -m)"
          chmod +x /tmp/buf
          cd contracts/proto
          /tmp/buf lint
          /tmp/buf build

  lexicon:
    runs-on: ubuntu-latest
    env:
      LEXICON_DENYLIST: ${{ secrets.LEXICON_DENYLIST }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: naming denylist (contracts)
        run: |
          set -euo pipefail
          if [ -z "${LEXICON_DENYLIST:-}" ]; then
            echo "::notice::LEXICON_DENYLIST secret absent — naming-denylist check skipped"
            exit 0
          fi
          # Redact to file:line only; never echo the matched text.
          if grep -rniE "$LEXICON_DENYLIST" contracts/ | cut -d: -f1,2 | sort -u | grep -q .; then
            grep -rniE "$LEXICON_DENYLIST" contracts/ | cut -d: -f1,2 | sort -u
            echo "::error::denied term found in a contract file"
            exit 1
          fi
          echo "contracts/ is clean"

  composition:
    # Minutes of network-bound work; the 360-minute default would hold a runner
    # for six hours on a wedged clone.
    timeout-minutes: 15
    # Its own job: this clones a sibling repo and runs a cold Go build, which is
    # minutes of network-bound work -- measured, not the 11s a warm cache
    # suggests. Riding in a contract-validation job would let a clone flake red
    # "the contract documents are valid".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      # --compose shipped in #448 and ran in no workflow -- the same shape as the
      # honesty gate #121 wired, one level up.
      #
      # Report-only, but NOT for the reason the readiness step above gives. That
      # one reds until the legs merge; this one exits 0 today. A compose red is
      # actionable -- it means the sequence stopped delivering -- but only in
      # ocu-sandbox, never by the PR being tested here.
      #
      # `|| [ "$?" -eq 1 ]` tolerates exit 1 (composition does not hold) and lets
      # exit 2 (CANNOT JUDGE -- auth refused, a head branch gone) red the job.
      # Flattening both with `|| true` is the pattern this file already records
      # swallowing an auth failure every run while nobody noticed.
      - name: composition of the delivering PRs (report-only on exit 1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none \
            https://github.com/Wide-Moat/ocu-sandbox.git "$RUNNER_TEMP/sandbox"
          python3 scripts/check-readiness-claim.py --compose "$RUNNER_TEMP/sandbox" \
            || [ "$?" -eq 1 ]
