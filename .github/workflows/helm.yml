#
# Lints the Helm chart on every PR / push to main, and publishes versioned
# tarballs to a "gh-pages" Helm repo on release tags. Users can then:
#
#   helm repo add open-computer-use https://wide-moat.github.io/open-computer-use
#   helm repo update
#   helm install ocu open-computer-use/computer-use-server
#
# Chart version (helm/computer-use-server/Chart.yaml `version:`) must be bumped
# for chart-releaser to publish. `appVersion:` tracks the repo version.

name: Helm chart

on:
  push:
    # Both sides for both branches. next/v1 has no branch protection, so a
    # direct push can reach it without a pull request — checking only the PR
    # would leave that path unguarded.
    branches: [main, next/v1]
    tags: ['v*']
    paths:
      - 'helm/**'
      - 'examples/helm/**'
      - '.github/workflows/helm.yml'
  pull_request:
    # next/v1 too: the chart ships from this branch, and without it a PR
    # could break the chart with nothing saying so until the publish job ran
    # after the merge.
    branches: [main, next/v1]
    paths:
      - 'helm/**'
      - 'examples/helm/**'
      - '.github/workflows/helm.yml'

jobs:
  lint:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: v3.16.4   # Helm 3 LTS — chart-releaser-action does not yet ship a Helm 4 image
                            # and Helm 3 lints/templates the chart identically for our purposes.

      - name: helm lint (rejects missing required values)
        run: |
          set -e
          # Should fail — schema requires either secrets.mcpApiKey or secrets.existingSecret.
          if helm lint helm/computer-use-server 2>/dev/null; then
            echo "BUG: helm lint should have failed with empty secrets"
            exit 1
          fi
          # Should pass with all required keys set
          helm lint helm/computer-use-server \
            --set secrets.mcpApiKey=test \
            --set orchestrator.env.PUBLIC_BASE_URL=https://x.example.com
          # Examples must lint cleanly
          helm lint helm/computer-use-server -f examples/helm/standalone/values.yaml
          helm lint helm/computer-use-server -f examples/helm/with-open-webui/values-computer-use.yaml

      - name: helm template (default Kata path + runc fallback)
        run: |
          set -e
          # Default — Kata is the supported runtime; chart defaults render it.
          helm template ocu helm/computer-use-server \
            -f examples/helm/standalone/values.yaml \
            > /tmp/render-default.yaml
          grep -q "runtimeClassName: kata-qemu" /tmp/render-default.yaml
          grep -q "privileged: true" /tmp/render-default.yaml
          grep -q "name: orchestrator" /tmp/render-default.yaml
          grep -q "name: dind" /tmp/render-default.yaml
          grep -q "name: cleanup" /tmp/render-default.yaml
          # The Kata machinery must be present by default.
          grep -q "dind-entrypoint.sh" /tmp/render-default.yaml
          grep -q "volumeMode: Block" /tmp/render-default.yaml
          grep -q "devicePath: /dev/var-lib-docker" /tmp/render-default.yaml
          grep -q "storage-driver=fuse-overlayfs" /tmp/render-default.yaml
          # Unsupported runc fallback — explicit opt-out of every Kata knob.
          helm template ocu helm/computer-use-server \
            --set secrets.mcpApiKey=t \
            --set orchestrator.env.PUBLIC_BASE_URL=https://x \
            --set orchestrator.runtimeClassName="" \
            --set dind.privileged=null \
            --set dind.kataInit.enabled=false \
            --set dind.storageDriver=overlay2 \
            --set persistence.varLibDocker.persistentVolume.enabled=false \
            > /tmp/render-runc.yaml
          grep -q "privileged: true" /tmp/render-runc.yaml
          # Each runc-path assertion is written as an explicit if/exit rather than
          # `! grep -q ...`: a pipeline inverted with `!` is exempt from errexit, so
          # such an assertion only fails the step when it happens to be the last
          # command in the script.
          if grep -q "runtimeClassName:" /tmp/render-runc.yaml; then
            echo "::error::the runc path must not pin a runtimeClass -- found 'runtimeClassName:' in the runc render"
            exit 1
          fi
          if grep -q "checksum/dind-init:" /tmp/render-runc.yaml; then
            echo "::error::the runc path must not carry the kata init checksum annotation -- found 'checksum/dind-init:' in the runc render"
            exit 1
          fi
          if grep -q "name: dind-init" /tmp/render-runc.yaml; then
            echo "::error::the runc path must not mount the kata init volume -- found 'name: dind-init' in the runc render"
            exit 1
          fi
          if grep -q "dind-entrypoint.sh" /tmp/render-runc.yaml; then
            echo "::error::the runc path must not mount the kata init entrypoint -- found 'dind-entrypoint.sh' in the runc render"
            exit 1
          fi
          if grep -q "volumeMode: Block" /tmp/render-runc.yaml; then
            echo "::error::the runc path must not request a block device -- found 'volumeMode: Block' in the runc render"
            exit 1
          fi

      - name: Install kubeconform and validate manifests against k8s schemas
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          # NFR-FLEX-13 (k8s-distro portability: the chart installs on any
          # conformant k8s >= 1.28 without flavour-specific edits). Its target
          # column asks for a CI matrix and this validated one version, which
          # answers "the chart is valid on 1.30" rather than the requirement.
          # Both ends of the supported range are checked plus a mid point, so a
          # manifest using an API removed after 1.28 or one not yet present in
          # it fails here rather than at a customer's install. Named beside the
          # assertion on the NFR-SEC-19 convention; this job blocks.
          for kube in 1.28.0 1.30.0 1.32.0; do
            echo "::group::kubeconform against k8s ${kube}"
            kubeconform -strict -summary -kubernetes-version "${kube}" /tmp/render-default.yaml
            kubeconform -strict -summary -kubernetes-version "${kube}" /tmp/render-runc.yaml
            echo "::endgroup::"
          done

  release:
    name: Publish chart to gh-pages
    needs: lint
    runs-on: ubuntu-latest
    # Only on stable release tags. SemVer pre-release suffixes (`-rc.N`,
    # `-alpha.N`, `-beta.N`) are routed to OCI publish via release-chart.yml
    # — they must NOT land on gh-pages, otherwise stable users running
    # `helm repo update && helm install` would resolve them.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
          fetch-depth: 0  # chart-releaser needs full history to detect tag bumps

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: v3.16.4

      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f  # v1.7.0
        with:
          charts_dir: helm
          mark_as_latest: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
