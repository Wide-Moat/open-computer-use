#
# The NFR gates, on every pull request rather than only on contract changes.
#
# They lived in contracts-lint.yml, which filters on contracts/**, scripts/**
# and its own file. `nfr-gates` is a REQUIRED context, so a PR touching none of
# those paths produced it ABSENT rather than red -- measured on #508:
# required=10, present=8, absent nfr-gates and asyncapi. Invisible while
# next/v1 is unprotected (#408), and a permanent block the day it is not: a
# required context that never arrives cannot be re-run into existence (#510).
#
# asyncapi keeps its filter and stays in contracts-lint.yml. It validates
# contracts/, so firing on contract changes is what it is for. This job is
# different in kind -- the readiness claim, the NFR-coverage ratchet, the pin
# policy, the cross-repo NFR-SEC-89 verdict -- and none of it reads contracts/.

name: nfr-gates

on:
  pull_request:
  push:
    branches:
      - next/v1

permissions:
  contents: read

jobs:
  nfr-gates:
    # Their own job, not more steps on the AsyncAPI one. They lived there
    # because that is where the first of them landed, and a failure in
    # step 3 -- a network validation against a remote schema -- skipped
    # every one of them SILENTLY: no step with `if:` or continue-on-error,
    # so an unrelated flake disarmed the whole NFR set and the run still
    # reported the one failure it had. Measured before splitting: 16 steps
    # in a job named for contracts, 10 of them about something else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
      - name: gate-enforcement red-probe (six shapes, one clean)
        run: python3 scripts/check-gates-are-required.py --self-test
      # The live query is REPORT-ONLY today, and deliberately so: it currently
      # reds, because next/v1 has no branch protection and the one ruleset
      # carries enforcement=disabled. Making it blocking now would red every PR
      # for a condition no PR can fix -- enabling protection is an owner action.
      # It is here rather than absent so the violation is visible on every run
      # instead of living in a report nobody opens.
      #
      # The commit that turns enforcement on drops the `|| true` AND must carry
      # three things, or it deadlocks or lies:
      #   1. Enforce via a RULESET, not classic branch protection. The
      #      protection endpoint answers 403 to the Actions token
      #      (administration:read cannot be granted there), so CI can only
      #      observe rulesets. Note this cuts against scripts/apply-layer0-
      #      protection.sh, which writes CLASSIC protection: flipping with that
      #      tool leaves this step permanently red on the cannot-establish
      #      message, correct protection notwithstanding, unless the step is
      #      given an admin-scoped PAT. Flipping via a ruleset keeps
      #      GITHUB_TOKEN sufficient. The applier's REQUIRED list also gains the
      #      codeql context once item 2 lands, or its own verdict reds.
      #   2. Extend codeql.yml's triggers to this branch. It fires on main and
      #      cron only, so no codeql context reports on a next/v1 PR today —
      #      requiring one would block every PR forever on a check that never
      #      arrives.
      #   3. Remove `continue-on-error: true` from sast-semgrep in
      #      security.yml. A required context that cannot fail is green whatever
      #      it finds, which is the exact shape this NFR exists to name.
      #   4. DONE. The `composition` job is retired. It composed the delivering
      #      PRs to show the sequence still delivers; they merged, their head
      #      branches deleted, and it red exactly as recorded here --
      #      `origin/feat/e1-userns-admission does not resolve`. That red was
      #      the reminder and it worked. Nothing replaces it: a green on a
      #      throwaway composed tree was a claim about a future merge, and the
      #      merge has happened, so the readiness check below now reads the
      #      shipped branches instead of predicting them.
      # The readiness claim is worth nothing if it is only ever answered when
      # somebody remembers to ask. Report-only for the same reason as the check
      # below: it reports 0 of 4 today because the legs sit in open pull
      # requests, and no PR can fix that — merging them is a review action.
      # What this buys is that the number is on every run, so the day it becomes
      # 4 of 4 nobody has to take that on trust, and the day it regresses the
      # log says so.
      # The self-test is the gate. The live query below is report-only, so
      # without this the delivery reporting could stop discriminating and no
      # run would notice.
      - name: delivery reporting red-probe (six outcomes through the report)
        run: python3 scripts/check-readiness-claim.py --self-test
      - name: deployment-readiness claim (report-only, see NFR §Deployment-readiness)
        # Reads a sibling component's default branch through the contents API.
        # That works from here because the components are public; were one made
        # private, this step would report its leg as unreadable — exit 2, which
        # the script distinguishes from unmet — rather than silently calling the
        # property missing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-readiness-claim.py || true
      - name: the guest-env checker itself discriminates
        run: python3 scripts/check-guest-env-allowlist.py --self-test

      # NFR-SEC-75 (guest env from an allowlist; no secret on argv). The row
      # forbids INHERITING the host environment and explicitly permits handing a
      # secret to a tool through the env -- so ANTHROPIC_AUTH_TOKEN in the guest
      # env dict is compliant and flagging it would report a violation canon
      # licenses. What is checked is os.environ flowing into the builder, and a
      # secret name reaching a command string, because argv is world-readable
      # through /proc/<pid>/cmdline. Named here so the requirement counts as
      # armed; this job blocks.
      - name: the guest environment is allowlist-built and argv carries no secret
        run: python3 scripts/check-guest-env-allowlist.py

      - name: the session-window checker itself discriminates
        run: python3 scripts/check-session-windows.py --self-test

      # NFR-SEC-40 (session idle window <= 15 min). The row says the operator
      # may tune it DOWN, so the number that must satisfy the bound is the
      # shipped DEFAULT, not a runtime env var -- bounding the env would argue
      # with canon. Two defaults ship, in docker_manager.py and the chart's
      # values.yaml, and a drift between them means the container and the chart
      # apply different security windows. Named here so the requirement counts
      # as armed; this job blocks.
      - name: the shipped idle window is inside the NFR-SEC-40 bound
        run: python3 scripts/check-session-windows.py

      - name: the release-synthetic checker itself discriminates
        run: python3 scripts/check-release-synthetic.py --self-test

      - name: the browser-storage checker itself discriminates
        run: python3 scripts/check-browser-storage-clean.py --self-test

      - name: the file-activity overlay checker itself discriminates
        run: python3 scripts/check-file-activity-overlay.py --self-test

      - name: the SOAR-revoke checker itself discriminates
        run: python3 scripts/check-soar-revoke-frozen.py --self-test

      - name: the operator-body checker itself discriminates
        run: python3 scripts/check-operator-bodies-hint-only.py --self-test

      # NFR-SEC-26 (contract half). The operator surface establishes identity out
      # of band -- operatorPeerCred, from the peer credential of the host-owned
      # 0700 socket -- and the file states the consequence: bodies carry HINTS,
      # and no body field names a caller, session-authority or container_name,
      # because a body-supplied id is never the authority that binds a session.
      # A schema validator cannot see that: adding caller_id to a body is a
      # well-formed change and the pinned @redocly/cli@1.34.2 exits 0 on it.
      # `tenant` stays permitted -- MCPKeyCreateRequest scopes a new key with it
      # and says so; what is forbidden is a field naming WHO IS CALLING. Named
      # here so the requirement counts as armed; this job blocks.
      - name: no operator request body names the acting caller
        run: python3 scripts/check-operator-bodies-hint-only.py

      # NFR-COMP-27, the inbound half. The outbound webhook is a stated boundary
      # rather than a gap in this contract set -- audit-fanin.asyncapi.yaml:29
      # says the webhook is a separate surface -- so only the admin API IN is
      # claimed here. The contract puts the revoke authority in an in-body
      # assertion (`soar_signature`) rather than an HTTP security scheme, and a
      # field can be made optional without a schema validator noticing:
      # dropping it from the required list and running the pinned
      # @redocly/cli@1.34.2 exits 0, "Your API description is valid". Named here
      # so the requirement counts as armed; this job blocks.
      - name: the SOAR revoke surface still requires the assertion that authorizes it
        run: python3 scripts/check-soar-revoke-frozen.py

      # NFR-SEC-79, the contract half. The chain-linkage half is not claimed:
      # audit-fanin.asyncapi.yaml:230 says prev_hash/chain_hash are authored by
      # the pipeline at ingest and are not part of the publish payload. What IS
      # on the wire is the mandatory set, and two documents state it -- the
      # AsyncAPI overlay named for this requirement, and FileActivityEvent in
      # file-artifact-api.schema.json. Either can be relaxed alone without
      # breaking anything else, so this compares them. The ocsf-class-identity
      # gate covers a different statement (title vs vendored class) and passes
      # on a relaxed overlay -- probed. Named here so the requirement counts as
      # armed; this job blocks.
      - name: a file-activity event still carries the NFR-SEC-79 mandatory set
        run: python3 scripts/check-file-activity-overlay.py

      # NFR-SEC-82, the storage clause only. The row's embed-token half -- the
      # peer backend mints a short-TTL token and the UI verifies it before
      # setting session state -- belongs to the UI component, which is not in
      # this tree; every mention of the embed token here is a comment about what
      # the portal does. What this repository owns is the browser surface it
      # serves, so the clause checked is "zero OCU upstream credential reaches
      # browser storage". Measured: one storage write in the whole frontend, a
      # UI boolean. Named here so the requirement counts as armed; this job
      # blocks.
      - name: no upstream credential reaches browser storage
        run: python3 scripts/check-browser-storage-clean.py

      # NFR-MAINT-05 (synthetic transactions per deploy, "presence + success").
      # The mechanism was present and unbound: build.yml stands a server up and
      # drives /mcp against it, but it triggers on branches and pull requests,
      # never on `push: tags`, so a tag published a release nothing had
      # exercised. release.yml now runs the same live endpoint script and the
      # publishing job needs it. The check walks the needs-graph instead of
      # grepping for the word, because a grep passed on the unbound tree.
      # Named here so the requirement counts as armed; this job blocks.
      - name: no release publishes without a synthetic transaction
        run: python3 scripts/check-release-synthetic.py

      - name: the MCP protocol checker itself discriminates
        run: python3 scripts/check-mcp-protocol-version.py --self-test

      # NFR-FLEX-14 (MCP is OCU's inbound wire protocol). The contract tree
      # freezes a protocol version by directory name, and the server negotiates
      # whatever the mcp pin supports -- nothing compared the two. Bump the pin
      # to a release that drops the frozen version and every schema gate stays
      # green while the contract describes a protocol the server cannot speak.
      # Named here so the requirement counts as armed; this job blocks.
      - name: the frozen MCP version is one the pin can speak
        run: |
          set -euo pipefail
          pip install -q "$(grep -E '^mcp==' computer-use-server/requirements.txt)"
          python3 scripts/check-mcp-protocol-version.py

      - name: the security.txt checker itself discriminates
        run: python3 scripts/check-security-txt.py --self-test

      # NFR-COMP-19 (public vulnerability-disclosure record). Named here so
      # check-nfr-coverage.py counts the requirement as armed: this job blocks,
      # and the assertion is that /.well-known/security.txt carries the RFC 9116
      # fields AND has not expired. SECURITY.md answers a human reader; a
      # scanner needs the record, and an expired record publishes a channel
      # nobody has promised to watch.
      - name: the disclosure record is machine-readable and current
        run: python3 scripts/check-security-txt.py

      - name: the canon-trigger checker itself discriminates
        run: python3 scripts/check-gates-trigger-on-canon.py --self-test

      - name: every named gate reports on a next/v1 pull request
        # check-gates-are-required.py asks whether a context is REQUIRED. That
        # question assumes the context arrives. codeql.yml was filtered to
        # `branches: [main]`, so no codeql context reached a next/v1 PR and the
        # platform agreed -- code-scanning held 10 Trivy uploads for canon and
        # zero from CodeQL. The workflow existed, was pinned, and analysed
        # nothing on the branch it was supposed to guard.
        run: python3 scripts/check-gates-trigger-on-canon.py

      - name: the self-test stubber itself discriminates
        run: python3 scripts/check-self-tests-are-bound.py --self-test

      - name: every checker fails its own self-test when stubbed
        # One level up from the seven --self-test steps below. Those prove the
        # self-tests EXIST; this proves each would NOTICE. A self-test whose
        # fixtures agree with a broken predicate is the same fake-green it was
        # written to prevent, and it is invisible by construction: everything
        # stays green while nothing is checked.
        run: python3 scripts/check-self-tests-are-bound.py

      - name: the vendor-SDK checker itself discriminates
        run: python3 scripts/check-no-vendor-sdk.py --self-test

      - name: OCU's own code imports no upstream-vendor SDK
        # NFR-FLEX-01 (import half). Parsed with ast, not grepped: this repo
        # names every vendor in prose, including in the checker's own docstring.
        # skills/ and tests/ are out of scope on purpose -- a skill is the
        # caller's artifact, and the row says provider selection is the calling
        # client's concern. The endpoint-by-config half is runtime, not claimed.
        run: python3 scripts/check-no-vendor-sdk.py

      - name: the schema-closure checker itself discriminates
        run: python3 scripts/check-schemas-are-closed.py --self-test

      - name: every authored schema shape is closed, or says why not
        # NFR-SEC-51 (contract half). The runtime half -- reject-on-unknown-field
        # at the gateway before dispatch -- is not provable from here and is not
        # claimed. A node may stay open, but it must carry `x-open-because`: a
        # dedicated key, because matching prose failed twice, on "Open Computer
        # Use Contributors" in every copyright line and on the literal word
        # additionalProperties inside a schema's own description.
        run: python3 scripts/check-schemas-are-closed.py

      - name: the compliance-front-matter checker itself discriminates
        run: python3 scripts/check-compliance-front-matter.py --self-test

      - name: how many controls each component spec declares
        # NFR-COMP-17. The field was empty in all seven specs, and the earlier
        # reading of that -- "which controls a component satisfies is an owner's
        # judgement" -- was only half right. It is a judgement, and it was
        # already made: each spec declares the ADRs that govern it, and 43 of 45
        # ADRs carry a populated compliance-impact. So the entries are derived
        # from decisions already accepted rather than invented, and every one of
        # the 61 traces to an ADR the spec itself names.
        #
        # The floor is now 61, not 0. Losing a control citation reds.
        run: python3 scripts/check-compliance-front-matter.py --min-declared 61

      - name: the pin-policy checker itself discriminates
        run: python3 scripts/check-pin-policy.py --self-test

      - name: every action and container image names an immutable ref
        # NFR-SEC-18. security.yml states this policy in a header comment and
        # credits zizmor with enforcing it; zizmor appears in five comments and
        # in no executed step, so until now the policy was a claim about a tool
        # that does not run here.
        run: python3 scripts/check-pin-policy.py

      - name: the NFR-coverage checker itself discriminates
        run: python3 scripts/check-nfr-coverage.py --self-test

      - name: how many NFRs are checked by something that runs
        # A ratchet, not a target. It reds when an armed NFR becomes unarmed or
        # when a check names an id the manifesto no longer declares -- both are
        # regressions a PR causes and a PR can fix. It does NOT red for the
        # unarmed remainder: that is the state of the layer, no single PR can
        # move it, and a gate nobody can turn green is a gate that gets ignored.
        # The number on every run is the point.
        run: python3 scripts/check-nfr-coverage.py --min-armed 22

      - name: gate enforcement across the platform (report-only until protection is on)
        # The github context reaches the script through env, never by
        # interpolation inside the run block. A branch name is
        # attacker-controllable on a fork PR, so interpolating it into the shell
        # would let it close the quote and run its own command on the runner.
        # The SAST gate flags exactly this, and it flagged it here.
        #
        # Three repositories, not one. NFR-SEC-89 is a claim about the platform,
        # and a sandbox or a File Pane that can be merged past its own gates
        # breaks it exactly as this repository would. Measured while this step
        # judged only itself: ocu-webui ran CodeQL green on every pull request
        # while requiring 11 contexts, none of them CodeQL — a finding this step
        # could not have made, because it never looked. The sibling reads work
        # from CI on the same token that check-readiness-claim.py already uses to
        # read ocu-sandbox.
        #
        # Each sibling is judged on its own release branch. The continue-on-error
        # sub-check silently drops for a repository that is not this checkout —
        # the script says so on stderr — so a sibling verdict covers protection
        # and rulesets, not the local workflow files.
        env:
          TARGET_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          # Without a token `gh` refuses to run inside Actions at all, and the
          # `|| true` below swallowed the refusal — so this step reported an auth
          # error every run and nobody saw it. A report-only step that cannot
          # execute is the theatre this NFR exists to name.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-gates-are-required.py \
            --repo "$TARGET_REPO" \
            --branch "$TARGET_BRANCH" || true
          for sibling in Wide-Moat/ocu-sandbox Wide-Moat/ocu-webui; do
            echo "::group::NFR-SEC-89 — ${sibling}@main"
            python3 scripts/check-gates-are-required.py \
              --repo "$sibling" \
              --branch main || true
            echo "::endgroup::"
          done

