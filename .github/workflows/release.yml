name: Release

on:
  push:
    tags: ['v*']

# Least privilege per job: only the publishing job writes. The synthetic job
# reads the tree and talks to localhost.
permissions:
  contents: read

jobs:
  synthetic:
    name: Synthetic — POST /mcp against the tagged tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # NFR-MAINT-05 asks for a synthetic transaction per deploy, "presence +
    # success". The mechanism already existed in build.yml, but build.yml runs
    # on branches and pull requests -- never on `push: tags`. So a tag published
    # a release that nothing had driven. This job closes that: it stands the
    # server up from the tagged tree and drives the same live endpoint script,
    # and `release` needs it, so a failure here stops the publish.

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build computer-use-server image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./computer-use-server
          load: true
          tags: cu-server:release-smoke
          cache-from: type=gha,scope=server-smoke

      - name: Start computer-use-server
        run: |
          # No real Docker socket needed: the orchestrator only has to boot,
          # register MCP, and answer /health + /mcp. Sandbox container creation
          # is exercised by build.yml's integration job, not here.
          docker run -d --name cu-server -p 8081:8081 \
            -e PUBLIC_BASE_URL=http://localhost:8081 \
            -e BASE_DATA_DIR=/tmp/data \
            cu-server:release-smoke

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
              echo ""; echo "healthy after ${i}s"; exit 0
            fi
            printf '.'
            sleep 1
          done
          echo ""; echo "TIMEOUT — server never became healthy"
          docker logs cu-server || true
          exit 1

      - name: Smoke /mcp endpoint
        run: |
          chmod +x tests/test-mcp-endpoint-live.sh
          ./tests/test-mcp-endpoint-live.sh http://localhost:8081

      - name: Dump server logs on failure
        if: failure()
        run: docker logs cu-server || true

  release:
    name: Create GitHub Release
    needs: [synthetic]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # The job token stays in .git/config for every later step without this.
          persist-credentials: false
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-merges)
          else
            CHANGES=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Detect pre-release tag
        id: prerelease
        run: |
          # Strip leading v; if what's left contains a SemVer pre-release suffix
          # (`-rc.1`, `-alpha.2`, `-beta.0`, `-dev.X`), mark the GitHub Release
          # as a pre-release so the "Latest release" badge keeps pointing at
          # the most recent stable version.
          # Accept both 3-segment SemVer (`1.2.3-rc.1`) and the project's
          # 4-segment app-version scheme (`0.8.12.3-rc.1`). Any pre-release
          # suffix flips the release to "pre-release" in GitHub so the
          # "Latest" badge keeps tracking stable.
          v="${GITHUB_REF_NAME#v}"
          if echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-[A-Za-z0-9.]+$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          body: |
            ## Docker Images

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}-cleanup:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository }}-webui:${{ github.ref_name }}
            ```

            ## Helm chart (Kubernetes)

            ```bash
            # Image tags follow the 4-segment app version (e.g. 0.8.12.3);
            # Helm chart versions are 3-segment SemVer, so strip the 4th
            # segment (and any pre-release suffix) for --version.
            VERSION="${{ github.ref_name }}"; VERSION="${VERSION#v}"
            CHART_VERSION="$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?(-.*)?$/\1\3/')"
            helm install ocu oci://ghcr.io/${{ github.repository_owner }}/charts/computer-use-server \
              --version "$CHART_VERSION" \
              -f my-values.yaml \
              --set image.tag="$VERSION" \
              --set workspaceImage.tag="$VERSION" \
              --set cleanup.image.tag="$VERSION"
            ```

            See [`helm/computer-use-server/README.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/helm/computer-use-server/README.md) for prerequisites (Kata Containers) and full values reference.

            ## Quick Start (Docker Compose)

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd open-computer-use
            git checkout ${{ github.ref_name }}
            cp .env.example .env
            # Edit .env with your API key
            docker compose up
            ```

            ## Changes
            ${{ steps.changelog.outputs.changes }}
